<!DOCTYPE html>

<style>
_{font-family:Arial,sans-serif;box-sizing:border-box;margin:0}
body{background:#f2f2f2;padding-bottom:85px}
.top{background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #0a7a42;position:sticky;top:0;z-index:10}
.top b{color:#0a7a42;font-size:13px}

.green{background:#0a7a42}.black{background:#111}.orange{background:#ff8800}.whatsapp{background:#25D366}.blue{background:#0a58ca}
.footer{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-top:2px solid #0a7a42;display:flex;padding:7px;gap:4px;z-index:20}
.footer button{flex:1;padding:10px;border:none;border-radius:20px;font-weight:800;color:#fff;font-size:10px}

.modal.show{display:flex}

.box input,.box textarea,.box select{width:100%;padding:9px;border:1.5px solid #0a7a42;border-radius:10px;margin-bottom:6px;font-size:11px}
.search{background:#fff;margin:8px 10px;border-radius:20px;padding:8px 12px;display:flex;border:2px solid #0a7a42}

<body>
<div class="top"><b>AMNA LEUP SN</b><div><button class="btn-top" onclick="openModal('compteModal')" id="compteBtn">COMPTE</button><button class="btn-top" style="background:#ff8800;color:#fff;border-color:#ff8800" onclick="openModal('vendeurModal')">VENDRE</button><button class="btn-top" style="background:#0a7a42;color:#fff" onclick="openModal('panierModal')">PANIER <span id="pcount">0</span></button></div></div>

<div id="vendeurProducts"></div>

<div class="footer">
<button class="green" onclick="openModal('panierModal')">PANIER <span id="pcount">0</span></button>

<button style="background:#128C7E" onclick="openModal('serviceModal')">SERVICE</button>

<div class="modal" id="vendeurModal"><div class="box"><h3>📸 VENDRE - Photo + Galerie</h3>
<input id="vNom" placeholder="Nom produit">
<select id="vCat"><option>ALIMENTATION</option><option>MOTO</option><option>VOITURE</option><option>LOGEMENT</option><option>MAISON</option><option>CONSOLES</option><option>INFORMATIQUE</option><option>SMARTPHONES</option><option>VETEMENTS</option><option>FEMME BEAUTE</option></select>

<input type="hidden" id="vImg"><img id="vPreview" style="width:100%;height:130px;object-fit:cover;border-radius:10px;display:none;margin:6px 0;border:2px solid #0a7a42">
<input id="vPrix" type="number" placeholder="Prix FCFA"><input id="vTel" placeholder="Whatsapp"><textarea id="vDesc" placeholder="Description"></textarea><button class="btn whatsapp" onclick="ajouterProduit()">ENVOYER</button><button class="btn" style="background:#ddd;color:#000" onclick="closeModals()">FERMER</button></div></div>

<div class="modal" id="panierModal"><div class="box"><h3>Panier</h3><div id="panierList"></div>

<input type="hidden" id="livraison" value="Livraison disponible">

<script>
let WA="221754560985";
let allProducts=JSON.parse(localStorage.getItem('amna_final')||'[]');
let user=JSON.parse(localStorage.getItem('amna_user')||'null');
let panier=JSON.parse(localStorage.getItem('amna_panier')||'[]');
function handleFile(input,targetId,previewId){
  if(input.files && http://input.files){
    let reader=new FileReader();
    http://reader.onload=function(e){
      http://document.getElementById(targetId).value=e.target.result;
      http://document.getElementById(previewId).src=e.target.result;
      http://document.getElementById(previewId).style.display='block';
    };
    http://reader.readAsDataURL(input.files);
  }
}
function save(){localStorage.setItem('amna_final',JSON.stringify(allProducts));}
function renderAll(){let html="";let cats={};allProducts.filter(p=>p.statut=='valide').forEach(p=>{if(!cats[p.cat])cats[p.cat]=[];cats[p.cat].push(p);});for(let cat in cats){html+=`<div class="sec"><h2>${cat}</h2><div class="grid">`;cats[cat].forEach(p=>{html+=`<div class="cage"><img src="${p.img}"><p>${p.name}<br><span style="color:green">${p.prix}F</span></p><button class="btn black" onclick="addPanier('${p.name}')">PANIER</button></div>`;});html+=`</div></div>`;}document.getElementById('vendeurProducts').innerHTML=html;document.querySelectorAll('#pcount').forEach(c=>c.innerText=panier.length);}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
function openModal(id){closeModals();document.getElementById(id).classList.add('show');if(id=='panierModal')renderPanier();}
function addPanier(n){let prod=allProducts.find(p=>p.name===n);panier.push(prod||{name:n});localStorage.setItem('amna_panier',JSON.stringify(panier));document.querySelectorAll('#pcount').forEach(c=>c.innerText=panier.length);}
function renderPanier(){let d=document.getElementById('panierList');if(!panier.length){d.innerHTML="<p>Vide</p>";return;}d.innerHTML=panier.map((x,i)=>`<div style='display:flex;justify-content:space-between'><span>${x.name}</span><span onclick="panier.splice(${i},1);localStorage.setItem('amna_panier',JSON.stringify(panier));renderPanier();renderAll()">X</span></div>`).join('');}
function commander(){if(!panier.length)return;let liv=document.getElementById('livraison').value;let m=`COMMANDE AMNA LEUP%0A${liv}%0A`+panier.map(p=>p.name).join('%0A');window.open(`https://wa.me/${WA}?text=${m}`,"_blank");panier=[];localStorage.setItem('amna_panier','[]');renderAll();closeModals();}
function ajouterProduit(){let nom=document.getElementById('vNom').value,prix=document.getElementById('vPrix').value,img=document.getElementById('vImg').value,tel=document.getElementById('vTel').value,cat=document.getElementById('vCat').value;if(!nom||!prix||!img)return alert("Nom+prix+photo!");allProducts.push({name:nom,cat,img,vendeur:"Vendeur ("+tel+")",prix,statut:"valide"});save();renderAll();closeModals();}
function creerCompte(){let n=document.getElementById('nom').value,t=document.getElementById('tel').value;user={nom:n,tel:t};localStorage.setItem('amna_user',JSON.stringify(user));closeModals();}
function logout(){localStorage.removeItem('amna_user');user=null;closeModals();}
renderAll();
</script>
</body>
