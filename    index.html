<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMNA LEUP SN</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#008000;color:white;padding:15px;text-align:center}
.search{padding:10px} input{width:90%;padding:12px;border-radius:20px;border:1px solid #ccc}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:15px;padding:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card img{width:100%;height:100px;object-fit:contain}
.price{font-weight:bold;margin:5px;color:green}
.btn{background:#25D366;color:white;border:none;padding:10px;width:100%;border-radius:10px;font-weight:bold}
.bar{position:fixed;bottom:0;width:100%;background:black;color:white;padding:15px;text-align:center}
</style>
</head>
<body>
<div class="header"><h2>AMNA LEUP SN</h2><p>Tous les produits livrés à Dakar</p></div>
<div class="search"><input id="s" placeholder="Chercher..." oninput="chercher()"></div>
<div class="products" id="list"></div>
<div class="bar" id="panier">Panier: 0 FCFA - <b onclick="cmd()">Commander</b></div>
<script>
let produits = [
{n:"Samsung A55", p:285000, img:"https://via.placeholder.com/150?text=Phone"},
{n:"Nike Air Max", p:45000, img:"https://via.placeholder.com/150?text=Shoes"},
{n:"Chemise Wax", p:12000, img:"https://via.placeholder.com/150?text=Wax"},
{n:"Robe Africaine", p:25000, img:"https://via.placeholder.com/150?text=Robe"},
{n:"Tecno Spark 20", p:95000, img:"https://via.placeholder.com/150?text=Tecno"}
];
let total=0; let choix=[];
function afficher(l){let h=""; l.forEach(x=>{h+=`<div class=card><img src=${x.img}><h4>${x.n}</h4><div class=price>${x.p.toLocaleString()} FCFA</div><button class=btn onclick="add(${x.p},'${x.n}')">Ajouter</button></div>`}); document.getElementById("list").innerHTML=h}
function add(p,n){total+=p; choix.push(n); document.getElementById("panier").innerHTML=`Panier: ${total.toLocaleString()} FCFA - <b onclick="cmd()">Commander WhatsApp (${choix.length})</b>`}
function chercher(){let q=document.getElementById("s").value.toLowerCase(); afficher(produits.filter(a=>a.n.toLowerCase().includes(q)))}
function cmd(){if(choix.length==0){alert("Ajoute un produit d'abord"); return} let m=`Salam AMNA LEUP SN, je veux commander: ${choix.join(', ')} Total: ${total} FCFA`; window.open(`https://wa.me/221754560985?text=`+encodeURIComponent(m))}
afficher(produits);
</script>
</body>
</html>
